name: mitvana_app

networks:
  mitvana_network:
    driver: bridge


services:

  mysql:
    image: mysql/mysql-server:8.0
    container_name: mitvana_mysql
    restart: unless-stopped
    tty: true
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --max-connections=500
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_HOST=${DB_HOST}
      - MYSQL_PORT=${DB_PORT}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    networks:
      - mitvana_network

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    container_name: mitvana_phpmyadmin
    restart: unless-stopped
    ports:
      - '8086:80'
    env_file:
      - .env
    environment:
      - PMA_HOST=mysql
      - PHP_ENABLE_XDEBUG=0
      - UPLOAD_LIMIT=300M
      - PMA_PORT=${DB_PORT}
      - PMA_ABSOLUTE_URI=${APP_URL}/phpmyadmin/
    networks:
      - mitvana_network

  redis:
    image: redis:alpine
    container_name: mitvana_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis:/data
    networks:
      - mitvana_network